<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenCV Collage Editor</title>
  <desc id="desc">Python과 OpenCV로 만든 셀 기반 포토 콜라주 편집기</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#243B53"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="180" fill="#38BDF8" opacity=".08"/>
  <circle cx="1010" cy="390" r="220" fill="#818CF8" opacity=".08"/>
  <g transform="translate(80 74)">
    <text x="0" y="72" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">OpenCV Collage Editor</text>
    <text x="2" y="124" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="25">Cell-based image editing with independent history and filters</text>
    <g transform="translate(0 180)" font-family="Segoe UI, Arial, sans-serif" font-size="20">
      <rect width="122" height="42" rx="21" fill="#0EA5E9" opacity=".22"/>
      <text x="24" y="28" fill="#7DD3FC">Python</text>
      <rect x="138" width="132" height="42" rx="21" fill="#6366F1" opacity=".24"/>
      <text x="161" y="28" fill="#C7D2FE">OpenCV</text>
      <rect x="286" width="126" height="42" rx="21" fill="#14B8A6" opacity=".22"/>
      <text x="314" y="28" fill="#99F6E4">Tkinter</text>
    </g>
    <text x="2" y="286" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Layouts · Filters · Stickers · Undo · Image export</text>
  </g>
  <g transform="translate(860 86)">
    <rect width="310" height="248" rx="20" fill="#F8FAFC" opacity=".96"/>
    <rect x="18" y="18" width="76" height="212" rx="9" fill="#E2E8F0"/>
    <rect x="110" y="18" width="84" height="99" rx="8" fill="url(#accent)" opacity=".92"/>
    <rect x="208" y="18" width="84" height="99" rx="8" fill="#22C55E" opacity=".78"/>
    <rect x="110" y="131" width="84" height="99" rx="8" fill="#F59E0B" opacity=".82"/>
    <rect x="208" y="131" width="84" height="99" rx="8" fill="#EC4899" opacity=".78"/>
    <circle cx="56" cy="52" r="15" fill="#0EA5E9"/>
    <rect x="34" y="84" width="44" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="34" y="104" width="44" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="34" y="124" width="44" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="34" y="162" width="44" height="7" rx="3.5" fill="#64748B"/>
    <rect x="34" y="182" width="44" height="7" rx="3.5" fill="#64748B"/>
